import org.gradle.api.artifacts.repositories.MavenArtifactRepository

def mirrorUrl = 'https://maven.aliyun.com/repository/public'

def fixArtifactUrls = { repo ->
    try {
        def urls = new ArrayList<URI>(repo.artifactUrls)
        def changed = false
        for (int i = 0; i < urls.size(); i++) {
            if (urls[i] != null && urls[i].toString().contains('repo.maven.apache.org')) {
                urls.set(i, URI.create(mirrorUrl))
                changed = true
            }
        }
        if (changed) {
            repo.artifactUrls = urls
            println("Central mirror: artifactUrls of ${repo.name} -> $mirrorUrl")
        }
    } catch (Throwable t) {
        println("Central mirror: could not touch artifactUrls of ${repo.name}: ${t.message}")
    }
}

def rewrite = { repo ->
    if (repo instanceof MavenArtifactRepository) {
        def url = repo.url.toString()
        if (url.contains('repo.maven.apache.org') || url.contains('repo1.maven.org')) {
            println("Central mirror: ${repo.name} url -> $mirrorUrl")
            repo.url = mirrorUrl
        }
        fixArtifactUrls(repo)
    }
}

def attach = { handler ->
    handler.whenObjectAdded(rewrite)
    handler.all(rewrite)
}

gradle.beforeSettings { settings ->
    attach(settings.pluginManagement.repositories)
    attach(settings.dependencyResolutionManagement.repositories)
}

gradle.projectsLoaded {
    gradle.allprojects { project ->
        attach(project.repositories)
        attach(project.buildscript.repositories)
    }
}
